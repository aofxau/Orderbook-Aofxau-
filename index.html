<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Book — ต้นแบบ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
:root{--bg:#f4f5f7;--sf:#fff;--tx:#10151f;--mu:#667085;--bd:#dfe3ea;--buy:#1d5fd8;--sell:#d6362f;--px:#10151f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1118;--sf:#141b26;--tx:#e8ecf2;--mu:#8793a6;--bd:#243044;--buy:#4a8bff;--sell:#ff6259;--px:#e8ecf2}}
:root[data-theme="dark"]{--bg:#0c1118;--sf:#141b26;--tx:#e8ecf2;--mu:#8793a6;--bd:#243044;--buy:#4a8bff;--sell:#ff6259;--px:#e8ecf2}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1040px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.bar button:focus-visible{outline:2px solid var(--buy);outline-offset:2px}
.bar select,.bar input{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 8px;border-radius:6px}.seg{display:inline-flex;gap:4px}.seg button{min-width:40px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:12px}
.chart{overflow-x:auto}
svg{display:block;width:100%;min-width:520px;height:auto;touch-action:none;cursor:crosshair}
svg text{fill:var(--mu);font-size:11px;font-family:inherit}
.st h2{font-size:14px;margin:0 0 10px}
.row{margin-bottom:14px}
.row p{display:flex;justify-content:space-between;margin:0 0 4px;font-size:13px}
.track{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bd)}
.track i{display:block;height:100%}
.leg{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-top:8px}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{font-size:12px;color:var(--mu);margin:14px 0 0}
</style>
</head>
<body>
<main>
<h1>Order Book <small style="font-size:11px;color:var(--mu)">v2</small></h1>
<p class="sub">แสดงการกระจายตัวของออเดอร์ที่รออยู่ในแต่ละระดับราคา เลื่อนล้อเมาส์หรือกดปุ่มเพื่อซูม ลากเพื่อเลื่อนขึ้นลง</p>
<div class="bar">
<select id="sym" aria-label="เลือกสินทรัพย์"></select>
<input type="date" id="dt" aria-label="วันที่">
<select id="tm" aria-label="เวลา"></select>
<span class="seg" role="group" aria-label="โหมดแท่ง"><button id="mAll" aria-pressed="true">All</button><button id="mNet" aria-pressed="false">Net</button></span>
<span class="seg" role="group" aria-label="ซูม"><button id="zo" aria-label="ซูมออก">−</button><button id="zi" aria-label="ซูมเข้า">+</button><button id="zr">รีเซ็ตซูม</button></span>
</div>
<p class="note" id="src" style="margin:0 0 8px" role="status"></p>
<div class="grid">
<div class="panel chart"><svg id="svg" viewBox="0 0 820 440" role="img" aria-label="กราฟราคาและแท่งออเดอร์"><defs><clipPath id="cp"><rect x="0" y="12" width="820" height="416"/></clipPath></defs><g id="main" clip-path="url(#cp)"></g><g id="ch" clip-path="url(#cp)"></g></svg></div>
<div class="panel st" id="stats"></div>
</div>
<div class="panel chart" style="margin-top:12px"><p class="note" style="margin:0 0 6px"><b style="color:var(--sell)">Sell ←</b> <span style="float:right"><b style="color:var(--buy)">→ Buy</b></span></p><svg id="svg2" viewBox="0 0 820 560" role="img" aria-label="ออเดอร์บุ๊คแนวตั้ง แกนราคาด้านซ้าย"><defs><clipPath id="cp2"><rect x="0" y="12" width="820" height="520"/></clipPath></defs><g id="t2" clip-path="url(#cp2)"></g><g id="t2h" clip-path="url(#cp2)"></g></svg></div>
<p class="note">ไม่ใช่คำแนะนำการลงทุน ข้อมูลเป็นการกระจายตัวของออเดอร์ลูกค้า OANDA และอัปเดตทุก 30 นาที</p>
</main>
<script>
window.addEventListener("error",function(e){var b=document.getElementById("src");if(b){b.textContent="ERROR: "+e.message+" (line "+e.lineno+")";b.style.color="#d6362f"}});
window.addEventListener("unhandledrejection",function(e){var b=document.getElementById("src");if(b){b.textContent="ERROR: "+(e.reason&&e.reason.message||e.reason);b.style.color="#d6362f"}});

const L=[["Forex","EURUSD",1.0842,1e-4],["Forex","GBPUSD",1.2915,1e-4],["Forex","USDJPY",151.42,.01],["Forex","USDCHF",.8815,1e-4],["Forex","AUDUSD",.6612,1e-4],["Forex","USDCAD",1.3845,1e-4],["Forex","NZDUSD",.6055,1e-4],["Forex","EURGBP",.8395,1e-4],["Forex","EURJPY",164.2,.01],["Forex","GBPJPY",195.4,.01],["Forex","AUDJPY",99.6,.01],["Forex","EURCHF",.956,1e-4],["โลหะ","XAUUSD",2385.5,.1],["โลหะ","XAGUSD",28.45,.001],["ดัชนี","NAS100",20450,1],["ดัชนี","SPX500",5850,.5],["ดัชนี","US30",42300,2],["ดัชนี","DE40",19400,1],["พลังงาน","USOIL",72.4,.01]];
const I={};L.forEach(([g,n,p,k],i)=>I[n]={p,pip:k,k:i+1,d:k>=1?(k%1?1:0):Math.max(0,-Math.floor(Math.log10(k)+1e-9))});
const $=id=>document.getElementById(id);
const sel=$("sym");
["Forex","โลหะ","ดัชนี","พลังงาน"].forEach(g=>{const o=document.createElement("optgroup");o.label=g;L.filter(x=>x[0]===g).forEach(x=>{const e=document.createElement("option");e.value=x[1];e.textContent=x[1]==="NAS100"?"NAS100 (Nasdaq)":x[1];o.appendChild(e)});sel.appendChild(o)});
const SL=1800000,pad=n=>String(n).padStart(2,"0");
for(let h=0;h<24;h++)for(const m of["00","30"]){const e=document.createElement("option");e.textContent=pad(h)+":"+m;$("tm").appendChild(e)}
function setNow(){const t=new Date(Math.floor(Date.now()/SL)*SL);$("dt").value=t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());$("tm").value=pad(t.getHours())+":"+pad(t.getMinutes())}
setNow();
let mode="all",z=1,off=0,D=null;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mock(real){
  const c=I[sel.value],t=new Date($("dt").value+"T"+($("tm").value||"00:00")).getTime();
  const slot=Math.floor((isNaN(t)?Date.now():t)/SL);
  const px=u=>c.p+c.pip*(120*Math.sin(u/37+c.k)+60*Math.sin(u/11+2*c.k)+25*Math.sin(u/3.3+3*c.k));
  let s=[];
  if(real&&real.length){s=real.slice()}else{for(let i=95;i>=0;i--)s.push(px(slot-i))}
  const cur=s[s.length-1],r=rng(slot*131+c.k*7919),N=40,cl=[],lv=[];
  let step=c.pip*8;
  if(real&&real.length){const rg=Math.max(...s)-Math.min(...s);step=Math.max(c.pip,rg*0.75/N)}
  for(let i=0;i<5;i++)cl.push((r()-.5)*N*1.8);
  for(let i=-N;i<=N;i++){if(!i)continue;let b=r()*.5,sl=r()*.5;
    cl.forEach(m=>{const w=Math.exp(-((i-m)**2)/8);b+=w*r()*(i<0?2.2:1);sl+=w*r()*(i>0?2.2:1)});
    lv.push({price:cur+i*step,buy:b,sell:sl})}
  const all=s.concat(lv.map(l=>l.price));
  D={c,s,cur,lv,step,mn:Math.min(...all),mx:Math.max(...all),pl:42+Math.round(r()*22)};
}
let live=false,sent=null;
async function loadSent(){
  sent=null;
  const t=new Date($("dt").value+"T"+($("tm").value||"00:00")).getTime();
  try{
    const r=await fetch("data/"+sel.value+".json",{cache:"no-cache"});
    if(!r.ok)return;
    const arr=await r.json();
    let best=null;
    for(const x of arr){if(x.ts<=t&&(!best||x.ts>best.ts))best=x}
    if(best&&typeof best.long==="number"&&typeof best.short==="number")sent={long:best.long,short:best.short};
  }catch(e){}
}
let realBook=false;
async function applyBook(T){
  try{
    const r=await fetch("data/book/"+sel.value+".json",{cache:"no-cache"});
    if(!r.ok)return;
    const arr=await r.json();
    let best=null;
    for(const x of arr){if(x.ts<=T&&T-x.ts<=6*3600000&&(!best||x.ts>best.ts))best=x}
    if(!best||!best.bins||!best.bins.length)return;
    const sh=D.cur-best.mid; // ชดเชยส่วนต่างราคาระหว่างโบรกกับตลาดแหล่งข้อมูล
    if(Math.abs(sh)/D.cur>0.02)return;
    const lv=best.bins.map(b=>({price:b.p+sh,buy:b.b,sell:b.s}));
    const all=D.s.concat(lv.map(l=>l.price));
    D.lv=lv;D.step=best.w;D.mn=Math.min(...all);D.mx=Math.max(...all);D.pl=null;realBook=true;
  }catch(e){}
}
let realPx=false;
async function build(){
  live=false;realPx=false;realBook=false;
  const t=new Date($("dt").value+"T"+($("tm").value||"00:00")).getTime();
  try{
    const r=await fetch("data/prices/"+sel.value+".json",{cache:"no-cache"});
    if(r.ok){
      const arr=await r.json();
      const T=isNaN(t)?Date.now():t;
      let cs=arr.filter(x=>typeof x.c==="number"&&x.t+SL<=T).slice(-96);
      if(cs.length){const md=cs.map(x=>x.c).sort((a,b)=>a-b)[cs.length>>1];cs=cs.filter(x=>Math.abs(x.c-md)/md<0.25)}
      if(cs.length>=10){mock(cs.map(x=>x.c));realPx=true;await applyBook(T);return}
    }
  }catch(e){}
  mock();
}
const W=820,yTop=12,bot=428,x0=10,x1=450,b0=470,b1=760;
function view(){const m=(D.mn+D.mx)/2,R=(D.mx-D.mn)*1.06/z;return[m+off-R/2,m+off+R/2]}
function draw(){
  const {c,s,cur,lv,step}=D,[lo,hi]=view(),y=v=>bot-(v-lo)/(hi-lo)*(bot-yTop);
  let o="";
  const gs=(hi-lo)/4;
  for(let i=0;i<=4;i++){const v=lo+gs*i,yy=y(v);o+=`<line x1="${x0}" x2="${b1}" y1="${yy}" y2="${yy}" stroke="var(--bd)"/><text x="${b1+8}" y="${yy+4}">${v.toFixed(c.d)}</text>`}
  const net=mode==="net",cx=(b0+b1)/2,hw=(b1-b0)/2;
  const mxT=Math.max(...lv.map(l=>net?Math.abs(l.buy-l.sell):l.buy+l.sell));
  const bh=Math.max(1.5,(step/(hi-lo))*(bot-yTop)*.82);
  if(net)o+=`<line x1="${cx}" x2="${cx}" y1="${yTop}" y2="${bot}" stroke="var(--mu)" stroke-dasharray="2 3"/>`;
  lv.forEach(l=>{const yy=y(l.price)-bh/2;if(yy>bot||yy<yTop-bh)return;
    const tip=`<title>${l.price.toFixed(c.d)} · buy ${l.buy.toFixed(2)} · sell ${l.sell.toFixed(2)} · net ${(l.buy-l.sell).toFixed(2)}</title>`;
    if(net){const n=l.buy-l.sell,w=Math.abs(n)/mxT*hw;o+=`<g>${tip}<rect x="${n>=0?cx:cx-w}" y="${yy}" width="${w}" height="${bh}" fill="var(${n>=0?"--buy":"--sell"})"/></g>`}
    else{const wb=l.buy/mxT*(b1-b0),ws=l.sell/mxT*(b1-b0);o+=`<g>${tip}<rect x="${b0}" y="${yy}" width="${wb}" height="${bh}" fill="var(--buy)"/><rect x="${b0+wb}" y="${yy}" width="${ws}" height="${bh}" fill="var(--sell)"/></g>`}});
  o+=`<polyline points="${s.map((v,i)=>`${x0+i/Math.max(1,s.length-1)*(x1-x0)},${y(v)}`).join(" ")}" fill="none" stroke="var(--px)" stroke-width="1.6"/>`;
  const yc=y(cur);
  o+=`<line x1="${x0}" x2="${b1}" y1="${yc}" y2="${yc}" stroke="var(--px)" stroke-dasharray="4 4"/><rect x="${b1+2}" y="${yc-9}" width="56" height="18" rx="3" fill="var(--px)"/><text x="${b1+6}" y="${yc+4}" style="fill:var(--bg)">${cur.toFixed(c.d)}</text>`;
  $("main").innerHTML=o;
  tlap();
}
const T2={top:12,bot:530,l:80,r:800};
function tlap(){
  const {c,cur,lv,step}=D,[lo,hi]=view(),H=T2.bot-T2.top,y=v=>T2.bot-(v-lo)/(hi-lo)*H;
  const net=mode==="net",cx=(T2.l+T2.r)/2,hw=(T2.r-T2.l)/2-6;
  const tot=lv.reduce((t,l)=>t+l.buy+l.sell,0)||1;
  const val=l=>net?Math.abs(l.buy-l.sell):Math.max(l.buy,l.sell);
  const mx=Math.max(...lv.map(val))||1,mp=mx/tot*100;
  let o="";
  const n=8,gs=(hi-lo)/n;
  for(let i=0;i<=n;i++){const v=lo+gs*i,yy=y(v);o+=`<line x1="${T2.l}" x2="${T2.r}" y1="${yy}" y2="${yy}" stroke="var(--bd)" stroke-dasharray="4 4"/><text x="${T2.l-8}" y="${yy+4}" text-anchor="end">${v.toFixed(c.d)}</text>`}
  o+=`<line x1="${cx}" x2="${cx}" y1="${T2.top}" y2="${T2.bot}" stroke="var(--mu)"/>`;
  const bh=Math.max(1.5,(step/(hi-lo))*H*.8);
  lv.forEach(l=>{const yy=y(l.price)-bh/2;if(yy>T2.bot||yy<T2.top-bh)return;
    const tip=`<title>${l.price.toFixed(c.d)} · buy ${l.buy.toFixed(2)} · sell ${l.sell.toFixed(2)}</title>`;
    if(net){const d=l.buy-l.sell,w=Math.abs(d)/mx*hw;o+=`<g>${tip}<rect x="${d>=0?cx:cx-w}" y="${yy}" width="${w}" height="${bh}" fill="var(${d>=0?"--buy":"--sell"})"/></g>`}
    else{const wb=l.buy/mx*hw,ws=l.sell/mx*hw;o+=`<g>${tip}<rect x="${cx-ws}" y="${yy}" width="${ws}" height="${bh}" fill="var(--sell)" opacity=".85"/><rect x="${cx}" y="${yy}" width="${wb}" height="${bh}" fill="var(--buy)" opacity=".85"/></g>`}});
  const yc=y(cur);
  o+=`<line x1="${T2.l}" x2="${T2.r}" y1="${yc}" y2="${yc}" stroke="#2ecc71" stroke-width="2"/><rect x="2" y="${yc-10}" width="72" height="20" rx="3" fill="#2ecc71"/><text x="38" y="${yc+4}" text-anchor="middle" style="fill:#06210f;font-weight:600">${cur.toFixed(c.d)}</text>`;
  o+=`<text x="${T2.l}" y="${T2.bot+16}" text-anchor="start">${mp.toFixed(2)}%</text><text x="${cx}" y="${T2.bot+16}" text-anchor="middle">0</text><text x="${T2.r}" y="${T2.bot+16}" text-anchor="end">${mp.toFixed(2)}%</text>`;
  $("t2").innerHTML=o;
}
function stats(){
  const {lv,cur,pl}=D,sum=a=>a.reduce((t,l)=>t+l.buy+l.sell,0);
  const ua=sum(lv.filter(l=>l.price>cur)),da=sum(lv.filter(l=>l.price<cur)),tb=lv.reduce((t,l)=>t+l.buy,0),ts=lv.reduce((t,l)=>t+l.sell,0);
  const pc=v=>Math.round(v)+"%";
  const row=(t,a,b,la,lb)=>`<div class="row"><p><span>${t}</span></p><div class="track"><i style="width:${a}%;background:var(--buy)"></i><i style="width:${b}%;background:var(--sell)"></i></div><p style="margin-top:4px;color:var(--mu)"><span>${la} ${pc(a)}</span><span>${lb} ${pc(b)}</span></p></div>`;
  $("stats").innerHTML=`<h2>${sel.value} · สถิติ</h2>`+row("ออเดอร์ที่รออยู่ ใต้/เหนือราคา",da/(da+ua)*100,ua/(da+ua)*100,"ใต้ราคา","เหนือราคา")+row("สัดส่วนออเดอร์ buy / sell",tb/(tb+ts)*100,ts/(tb+ts)*100,"Buy","Sell")+(sent?row("ลูกค้า IG ที่ถือ long / short",sent.long,sent.short,"Long","Short"):pl==null?"":row("โพสิชันที่เปิดอยู่ long / short",pl,100-pl,"Long","Short"))+`<div class="leg"><span><b style="background:var(--buy)"></b>ฝั่งซื้อ</span><span><b style="background:var(--sell)"></b>ฝั่งขาย</span></div>`;
}
async function refresh(reset){if(reset){z=1;off=0}await build();await loadSent();draw();stats();$("src").textContent="เส้นราคา: "+(realPx?"ข้อมูลจริงจาก IG":"ข้อมูลจำลอง (ยังไม่มีราคาจริงของช่วงนี้)")+" · แท่งออเดอร์: "+(realBook?"ข้อมูลจริง (ออเดอร์ที่ตั้งรอใน Binance)":"ข้อมูลจำลอง")+" · long/short: "+(sent?"ข้อมูลจริงจาก IG":"ข้อมูลจำลอง")}
function setZ(f){z=Math.min(12,Math.max(1,z*f));if(z===1)off=0;draw()}
function setMode(m){mode=m;$("mAll").setAttribute("aria-pressed",m==="all");$("mNet").setAttribute("aria-pressed",m==="net");draw()}
sel.onchange=()=>refresh(true);$("dt").onchange=$("tm").onchange=()=>refresh(true);
$("mAll").onclick=()=>setMode("all");$("mNet").onclick=()=>setMode("net");
$("zi").onclick=()=>setZ(1.5);$("zo").onclick=()=>setZ(1/1.5);$("zr").onclick=()=>{z=1;off=0;draw()};
const svg=$("svg");let drag=null;
const sy=e=>{const r=svg.getBoundingClientRect();return(e.clientY-r.top)*440/r.height};
const px2p=v=>{const[lo,hi]=view();return hi-(v-yTop)/(bot-yTop)*(hi-lo)};
svg.addEventListener("wheel",e=>{e.preventDefault();setZ(e.deltaY<0?1.15:1/1.15)},{passive:false});
svg.addEventListener("pointerdown",e=>{drag=sy(e);svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointerup",()=>{drag=null});
svg.addEventListener("pointermove",e=>{
  const v=sy(e);
  if(drag!==null&&e.buttons){const[lo,hi]=view();off+=(v-drag)*(hi-lo)/(bot-yTop);drag=v;draw()}
  if(v<yTop||v>bot){$("ch").innerHTML="";return}
  const p=px2p(v);
  $("ch").innerHTML=`<line x1="${x0}" x2="${b1}" y1="${v}" y2="${v}" stroke="var(--mu)" stroke-dasharray="2 3"/><rect x="${b1+2}" y="${v-9}" width="56" height="18" rx="3" fill="var(--mu)"/><text x="${b1+6}" y="${v+4}" style="fill:var(--bg)">${p.toFixed(D.c.d)}</text>`;
});
svg.addEventListener("pointerleave",()=>{$("ch").innerHTML=""});
const svg2=$("svg2");let drag2=null;
const sy2=e=>{const r=svg2.getBoundingClientRect();return(e.clientY-r.top)*560/r.height};
svg2.addEventListener("wheel",e=>{e.preventDefault();setZ(e.deltaY<0?1.15:1/1.15)},{passive:false});
svg2.addEventListener("pointerdown",e=>{drag2=sy2(e);svg2.setPointerCapture(e.pointerId)});
svg2.addEventListener("pointerup",()=>{drag2=null});
svg2.addEventListener("pointermove",e=>{
  const v=sy2(e);
  if(drag2!==null&&e.buttons){const[lo,hi]=view();off+=(v-drag2)*(hi-lo)/(T2.bot-T2.top);drag2=v;draw();return}
  if(v<T2.top||v>T2.bot){$("t2h").innerHTML="";return}
  const[lo,hi]=view(),p=hi-(v-T2.top)/(T2.bot-T2.top)*(hi-lo);
  $("t2h").innerHTML=`<line x1="${T2.l}" x2="${T2.r}" y1="${v}" y2="${v}" stroke="var(--mu)" stroke-dasharray="2 3"/><rect x="2" y="${v-9}" width="72" height="18" rx="3" fill="var(--mu)"/><text x="38" y="${v+4}" text-anchor="middle" style="fill:var(--bg)">${p.toFixed(D.c.d)}</text>`;
});
svg2.addEventListener("pointerleave",()=>{$("t2h").innerHTML=""});
refresh(true);
</script>
</body>
</html>
